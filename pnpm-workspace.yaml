packages:
  - test-apps/*
  - test-apps/cedar/*
  - test-apps/rwsdk/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  tsx: ^4.20.5
  typescript: 7.0.1-rc
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  "@vitest/browser-playwright": 5.0.3
  vite-plus: 1.1.0
  "@typescript/native-preview": 7.0.0-dev.20260707.2
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    typescript: "7.0.1-rc"
    vite: "*"
    vitest: "*"
allowBuilds:
  "@embedded-postgres/linux-x64": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  bun: true
  "@cedarjs/pg": true
  esbuild: true
  prisma: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - rwsdk@1.5.0
patchedDependencies:
  "@react-router/dev@7.18.4": patches/@react-router__dev@7.18.4.patch
